name: truth_armor
description: "TruthArmor — AI-powered personal, family & community digital safety. Pause. Verify. Protect."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Simple, student-friendly state management.
  provider: ^6.1.2
  # HTTPS calls to the TruthArmor secure backend.
  http: ^1.2.2
  # Pick a screenshot from the gallery or take a photo.
  image_picker: ^1.1.2
  # On-device OCR (Android + iOS). Text never leaves the phone during OCR.
  google_mlkit_text_recognition: ^0.15.0
  # Browser APIs, used to run Tesseract.js OCR in the web version.
  web: ^1.1.0
  # Stores settings + scan-history METADATA only (never message content).
  shared_preferences: ^2.3.2
  # Opens official verification websites / phone numbers.
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates Android/iOS launcher icons from assets/brand/app_icon.png
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1F33"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"
